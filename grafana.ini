# grafana.qa.guru — committed defaults. Password is never here (GF_SECURITY_ADMIN_PASSWORD).
[server]
domain = grafana.qa.guru
root_url = %(protocol)s://%(domain)s/
enable_gzip = true

[security]
admin_user = admin
admin_email = admin@qa.guru
disable_gravatar = true
cookie_samesite = lax

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[auth.anonymous]
enabled = false

[auth]
; The password form stays. It is the only door for the break-glass admin and for the two
; load-course teachers, whose logins are GetCourse emails and who are absent from Keycloak.
disable_login_form = false
disable_signout_menu = false
; Identify people by the IdP subject, never by email: the data room has 183 email collisions.
oauth_allow_insecure_email_lookup = false

; SSO — phase 11.qa-guru-identity, ADR 017. client_secret comes from the host .env
; (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, mode 600), never from this file.
[auth.generic_oauth]
enabled = true
; Button reads "Sign in with {name}". School-wide SSO caption is QA.GURU.
name = QA.GURU
icon = signin
client_id = grafana
; No `groups` scope: Keycloak has no such client scope, the claim comes from the client mapper.
scopes = openid profile email
auth_url = https://auth.qa.guru/realms/qaguru/protocol/openid-connect/auth
token_url = https://auth.qa.guru/realms/qaguru/protocol/openid-connect/token
api_url = https://auth.qa.guru/realms/qaguru/protocol/openid-connect/userinfo
; RP-initiated logout: Grafana appends id_token_hint. Needs post.logout.redirect.uris on
; the grafana client (not oauth2-proxy). Without this, Sign in with QA.GURU is silent SSO.
signout_redirect_url = https://auth.qa.guru/realms/qaguru/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.qa.guru%2Flogin
; Login must be the handle. Keycloak sends preferred_username, and Grafana only reads
; `login` / `username` by default — without this the login silently becomes the email.
login_attribute_path = preferred_username
allow_sign_up = true
auto_login = false
use_pkce = true
use_refresh_token = true
; Role from the groups claim (full path, so /staff not staff). Team Sync is Enterprise —
; Grafana teams stay manual. /students matches nothing and strict mode denies the login.
role_attribute_path = contains(groups[*], '/staff') && 'Admin' || contains(groups[*], '/mentors') && 'Viewer'
role_attribute_strict = true
skip_org_role_sync = false
allow_assign_grafana_admin = false

[paths]
provisioning = /etc/grafana/provisioning

[plugins]
preinstall_disabled = true

[log]
mode = console
