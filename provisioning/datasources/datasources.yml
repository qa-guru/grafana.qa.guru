# File provisioning (Grafana OSS). Users are NOT provisioned here —
# admin is GF_SECURITY_ADMIN_USER / grafana.ini [security].
apiVersion: 1
datasources:
  - name: Testdata
    uid: testdata
    type: grafana-testdata-datasource
    access: proxy
    isDefault: false
    editable: false
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  # Isolated load SUT (Selectel VM). Scrape allowed only from Box2 (ufw :9091).
  # Not Box2 :9090 (selenoid-warm-pool) and not docker service `prometheus:9090`.
  - name: load-sut
    uid: load-sut
    type: prometheus
    access: proxy
    url: http://95.213.181.142:9091
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
