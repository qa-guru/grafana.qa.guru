# File provisioning (Grafana OSS). Users are NOT provisioned here —
# admin is GF_SECURITY_ADMIN_USER / grafana.ini [security].
apiVersion: 1
datasources:
  - name: Testdata
    uid: testdata
    type: grafana-testdata-datasource
    access: proxy
    isDefault: false
    editable: false
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
