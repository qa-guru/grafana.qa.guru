# Grafana OSS — grafana.qa.guru
# Pin: grafana/grafana-oss:13.0.2 (not :latest).
# Admin: GF_SECURITY_ADMIN_* + grafana.ini [security] — OSS has no YAML users.

services:
  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_SECURITY_ADMIN_EMAIL: ${GF_SECURITY_ADMIN_EMAIL:-admin@qa.guru}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://127.0.0.1:3031}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # SSO secret only — the rest of generic_oauth is in grafana.ini. Empty on a stand
      # without SSO; install-box2.sh refuses to deploy an empty one when the ini enables it.
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3031}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ./provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  grafana_data:
